name: Non-human browser checks

on:
  push:
    branches: [feat/task13-browser-checks, feat/task14-workout-logging, feat/task15-rest-timer, feat/task16-saved-routines, feat/task17-workout-progress, master]
    paths:
      - .github/workflows/browser-checks.yml
      - src/**
      - public/**
      - tests/**
      - scripts/**
      - package*.json
      - '*config*'
      - index.html
      - .nvmrc
      - .gitattributes
      - '!**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    name: Fixed-pattern Chromium smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
